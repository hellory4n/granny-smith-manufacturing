<h2>smithing my granny rn</h2>

<p>choose xml file pls (must be an uncompress level xml)</p>
<button id="open-file">Open...</button>
<input type="file" id="file-dialog" style="display: none" />
<pre id="output"></pre>

<script>
	const openButton = document.getElementById("open-file");
	const fileDialog = document.getElementById("file-dialog");
	const output = document.getElementById("output");

	openButton.addEventListener("click", () => fileDialog.click());
	fileDialog.addEventListener("change", () => {
		const file = fileDialog.files[0];
		if (!file) return;
		const reader = new FileReader();
		reader.onload = () => {
			const content = reader.result;
			output.textContent = content;
		};
		reader.readAsText(file);
	});
